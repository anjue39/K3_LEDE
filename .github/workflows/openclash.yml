name: openclash   # 工作流名称，可根据需要改为更具描述性的名字

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  SOURCE_COMMIT: f8b9349cb8e1722bde2730bf23236e7310319314   # 无问题5.4内核稳定版本
  # SOURCE_COMMIT: ''   # 如果留空或注释掉此行，将强制使用最新 master 分支
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: openclash.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 清理不必要的软件源、dotnet、android 等占用空间的内容
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # 新增步骤：彻底清理上一次构建的残留，确保每次都是全新环境
    - name: Clean previous build & Prepare workdir
      run: |
        echo "开始清理旧的工作目录，防止旧文件、旧缓存污染本次编译"
        sudo rm -rf /workdir/openwrt || true
        sudo rm -rf /workdir/lede*   || true
        # 显示磁盘使用情况，便于调试
        df -hT /workdir
        echo "清理完成，准备全新下载源码"

    # 修改后的克隆步骤：更健壮的处理 commit 和 master 两种情况
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        
        if [ -z "${{ env.SOURCE_COMMIT }}" ]; then
          echo "SOURCE_COMMIT 未设置，使用最新 master 分支"
          git clone --depth=1 ${{ env.REPO_URL }} openwrt
        else
          echo "使用指定的 commit: ${{ env.SOURCE_COMMIT }}"
          # 使用 tarball 方式下载指定 commit，最快且不带历史记录
          curl -L "https://github.com/coolsnowwolf/lede/archive/${{ env.SOURCE_COMMIT }}.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz
          # 解压后的目录名可能是 lede-<commit> 或其他，统一重命名为 openwrt
          mv lede-* openwrt 2>/dev/null || mv lede openwrt 2>/dev/null || { echo "目录重命名失败"; exit 1; }
          rm -f source.tar.gz
        fi
        
        # 创建软链接，让后续步骤能通过 $GITHUB_WORKSPACE/openwrt 访问
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        # 如果仓库根目录有自定义 feeds.conf.default，则覆盖
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 移动自定义文件和 .config
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        # 如果你希望每次都强制重新下载所有软件包（最干净但最慢），可取消下面这行注释
        # rm -rf dl/*
        
        make defconfig
        make download -j8
        # 清理损坏或 0 大小的下载文件
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "使用 $(nproc) 线程编译"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 提取设备名称，用于 artifact/release 命名
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        # 如果后面有 gofile 等上传，可在这里添加链接（当前代码中缺少 gofile 步骤，已注释相关逻辑）
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
